<svg viewBox="0 0 350 100" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(10, 5)">
    <!-- Main Q Ring (Arc with gap at bottom-right) -->
    <!-- Start at 70 degrees (bottom-right), draw clockwise to 20 degrees (right-bottom) -->
    <path d="M 54.6 71.3 A 28 28 0 1 1 71.3 54.6" stroke="#5B7B94" stroke-width="16" fill="none" stroke-linecap="butt" />
    
    <!-- Center Dot -->
    <circle cx="45" cy="45" r="9" fill="#5B7B94" />
    
    <!-- Q Tail (Pill shape) -->
    <line x1="56" y1="56" x2="74" y2="74" stroke="#5B7B94" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Text -->
  <text x="120" y="65" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="#FDB813" letter-spacing="-1">
    Qi<tspan fill="#5B7B94">Card</tspan>
  </text>
</svg>
