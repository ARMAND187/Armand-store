<svg viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Translate a bit to center it vertically -->
  <g transform="translate(5, 5)">
    <!-- Main Q Ring (Arc with gap at bottom-right) -->
    <!-- Start at 62 degrees (bottom-right), draw clockwise to 28 degrees (right-bottom) -->
    <path d="M 60.0 73.3 A 32 32 0 1 1 73.3 60.0" stroke="#5B7B94" stroke-width="14" fill="none" stroke-linecap="butt" />
    
    <!-- Center Dot -->
    <circle cx="45" cy="45" r="8" fill="#5B7B94" />
    
    <!-- Q Tail (Pill shape) -->
    <line x1="53.5" y1="53.5" x2="80.4" y2="80.4" stroke="#5B7B94" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Text -->
  <text x="105" y="66" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="56" fill="#FDB813" letter-spacing="-1.5">
    Qi<tspan fill="#5B7B94">Card</tspan>
  </text>
</svg>
